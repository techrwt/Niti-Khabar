name: Niti Khabar - Build aur Deploy

on:
  push:
    branches: [main, master]
    paths:
      - "Data/batches/**"
      - "assets/images/**"
      - "pages/**"
      - "config/**"
      - "templates/**"
      - "static/**"
      - "scripts/**"
      - "requirements.txt"
  workflow_dispatch:

concurrency:
  group: niti-khabar-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  images:
    name: "1. Images ko WebP me badlo"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Images convert karo
        run: python scripts/convert_images.py
      - name: Badlaav commit karo
        run: |
          git config user.name "niti-khabar-bot"
          git config user.email "niti-khabar-bot@users.noreply.github.com"
          git add -A assets/images
          if git diff --cached --quiet; then
            echo "Koi image badli nahi, commit ki zarurat nahi."
          else
            N=$(git diff --cached --name-only --diff-filter=A | grep -c '\.webp$' || true)
            git commit -m "images: ${N} files WebP me convert [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && break
              echo "Push fail hua, dobara koshish ($i)..."; sleep 3
            done
          fi

  validate:
    name: "2. Batch aur Images ki jaanch (validate)"
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Jaanch karo (saari galtiyan ek saath dikhengi)
        run: python scripts/validate.py

  build:
    name: "3. Site banao (build)"
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: .cache/img
          key: img-variants-${{ hashFiles('assets/images/**') }}
          restore-keys: img-variants-
      - name: Site build karo
        run: python scripts/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: "4. Deploy (GitHub Pages)"
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
